<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>쭈로그</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --paper:#fbf6ee; --card:#fffdf9; --card-2:#f5ede1; --rule:#eadfce;
  --ink:#2e2520; --ink-2:#6b5d52; --ink-3:#a39385;
  --coral:#e2603f; --coral-soft:#fbe3da;
  --leaf:#3f8f5a; --leaf-soft:#e1f1e5;
  --sun:#c98a12; --sun-soft:#fbefd2;
  --plum:#b2344a; --plum-soft:#f8dde2;
  --stone:#ece4d8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1b1714; --card:#241f1b; --card-2:#2e2823; --rule:#3a322b;
    --ink:#f3ebe2; --ink-2:#c7b8aa; --ink-3:#8e7f72;
    --coral:#ff8a6a; --coral-soft:#4a2a20;
    --leaf:#6fcb8d; --leaf-soft:#1f3a28;
    --sun:#f2b84b; --sun-soft:#3f3115;
    --plum:#ff7d93; --plum-soft:#4a2028;
    --stone:#352e28;
  }
}
:root[data-theme="dark"]{
  --paper:#1b1714; --card:#241f1b; --card-2:#2e2823; --rule:#3a322b;
  --ink:#f3ebe2; --ink-2:#c7b8aa; --ink-3:#8e7f72;
  --coral:#ff8a6a; --coral-soft:#4a2a20;
  --leaf:#6fcb8d; --leaf-soft:#1f3a28;
  --sun:#f2b84b; --sun-soft:#3f3115;
  --plum:#ff7d93; --plum-soft:#4a2028;
  --stone:#352e28;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.6}
a{color:inherit}
.hand{font-family:"Gowun Dodum","Noto Sans KR",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:28px 16px 72px}

/* 상단 */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:18px;border-bottom:2px dashed var(--rule);margin-bottom:26px}
.logo{font-size:34px;line-height:1;font-weight:400;letter-spacing:-.01em}
.logo span{color:var(--coral)}
.today{color:var(--ink-2);font-size:14px;margin-top:6px}
.top-r{display:flex;gap:8px;align-items:center;color:var(--ink-3);font-size:12px;text-align:right}
.round-btn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--rule);background:var(--card);color:var(--ink-2);cursor:pointer;font-size:15px}

/* 히어로 */
.hero{display:grid;grid-template-columns:220px 1fr;gap:28px;align-items:center;background:var(--card);border-radius:28px;padding:26px;box-shadow:0 1px 0 var(--rule),0 12px 30px -18px rgba(90,50,20,.25)}
@media (max-width:680px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}}
.ring{position:relative;width:200px;height:200px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:48px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.ring .c small{color:var(--ink-3);font-size:12px;margin-top:4px}
.who{display:flex;gap:10px;align-items:center;margin-bottom:6px}
@media (max-width:680px){.who{justify-content:center}}
.who img{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--card-2)}
.who a{color:var(--ink-2);font-size:14px;text-decoration:none}
.stage{font-size:40px;line-height:1.15;margin:4px 0 2px}
.stage-sub{color:var(--ink-2);font-size:14px}
.path{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
@media (max-width:680px){.path{justify-content:center}}
.path .st{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 10px;border-radius:14px;background:var(--card-2);min-width:62px;opacity:.55}
.path .st.past{opacity:.9}
.path .st.now{opacity:1;background:var(--coral-soft);outline:2px solid var(--coral)}
.path .st i{font-style:normal;font-size:22px;line-height:1}
.path .st span{font-size:11px;color:var(--ink-2)}
.path .dots{display:flex;gap:3px}
.path .dots u{width:6px;height:6px;border-radius:50%;background:var(--rule);text-decoration:none}
.path .dots u.on{background:var(--coral)}
.warn{display:inline-block;margin-top:14px;background:var(--plum-soft);color:var(--plum);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}

/* 오늘의 메모 */
.memo{margin:26px 0;background:var(--sun-soft);border-radius:20px;padding:18px 22px;position:relative}
.memo h3{margin:0 0 8px;font-size:18px;font-weight:400}
.memo ul{margin:0;padding-left:0;list-style:none}
.memo li{padding:3px 0 3px 26px;position:relative}
.memo li::before{content:attr(data-i);position:absolute;left:0}

/* 숫자 줄 */
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:0;background:var(--card);border-radius:20px;overflow:hidden;margin-bottom:26px}
@media (max-width:680px){.strip{grid-template-columns:repeat(2,1fr)}}
.strip div{padding:16px 18px;border-right:1px solid var(--rule)}
.strip div:last-child{border-right:0}
.strip span{display:block;font-size:12px;color:var(--ink-3)}
.strip b{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.strip em{font-style:normal;font-size:12px;color:var(--ink-2);margin-left:4px}

.cols{display:grid;grid-template-columns:1.45fr 1fr;gap:22px}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.sec{background:var(--card);border-radius:24px;padding:22px;min-width:0;margin-bottom:22px}
.sec h3{margin:0 0 14px;font-size:20px;font-weight:400;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec h3 small{font-family:"Noto Sans KR";font-size:12px;color:var(--ink-3)}

.tabs{display:inline-flex;background:var(--card-2);border-radius:999px;padding:3px;gap:2px}
.tabs button{border:0;background:none;color:var(--ink-2);border-radius:999px;padding:4px 11px;font:inherit;font-size:12px;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* 글 카드 */
.plist{display:grid;gap:10px;margin-top:12px}
.post{display:grid;grid-template-columns:6px 1fr;gap:12px;background:var(--paper);border-radius:14px;padding:12px 14px 12px 10px;text-decoration:none}
.post:hover{background:var(--card-2)}
.post .bar{border-radius:3px}
.post .tt{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.post .mt{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12px;color:var(--ink-3);align-items:center;margin-top:2px}
.tag{font-size:12px;font-weight:700;border-radius:6px;padding:0 7px}
.s-ok{background:var(--leaf-soft);color:var(--leaf)}.s-miss{background:var(--plum-soft);color:var(--plum)}
.s-err{background:var(--sun-soft);color:var(--sun)}.s-off{background:var(--stone);color:var(--ink-2)}
.bar.s-ok{background:var(--leaf)}.bar.s-miss{background:var(--plum)}.bar.s-err{background:var(--sun)}.bar.s-off{background:var(--rule)}
.kwc{color:var(--coral);font-weight:500}
.kwc.out{color:var(--ink-3)}

/* 점수 구성 */
.mix{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px;background:var(--stone)}
.mix i{display:block;height:100%}
.legend{display:grid;gap:7px;margin-top:14px;font-size:13px}
.legend div{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center}
.legend s{width:12px;height:12px;border-radius:4px;display:block}
.legend b{font-variant-numeric:tabular-nums;font-weight:500;color:var(--ink-2)}

.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--rule);stroke-width:1;stroke-dasharray:2 4}
.chart .ax{fill:var(--ink-3);font-size:11px;font-family:"Noto Sans KR"}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;padding:5px 9px;border-radius:10px;white-space:nowrap;transform:translate(-50%,-115%);opacity:0;transition:opacity .1s}
.kwl{width:100%;border-collapse:collapse;font-size:14px}
.kwl td{padding:7px 0;border-bottom:1px dashed var(--rule)}
.kwl td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.empty{color:var(--ink-3);font-size:13px;text-align:center;padding:18px 0}
.foot{color:var(--ink-3);font-size:12px;text-align:center;margin-top:10px}
.setup{max-width:560px;margin:60px auto;text-align:center}
.setup ol{text-align:left;background:var(--card);border-radius:20px;padding:20px 20px 20px 40px}
.setup code{background:var(--card-2);padding:1px 6px;border-radius:5px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty hand">쭈로그를 펼치는 중…</div></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n == null ? "—" : n >= 10000 ? (n / 10000).toFixed(1).replace(/\.0$/, "") + "만" : n.toLocaleString("ko-KR");
const pct = v => v == null ? "—" : Math.round(v * 100) + "%";
const days = iso => iso ? Math.floor((Date.now() - new Date(iso)) / 864e5) : null;

function ago(iso) {
  if (!iso) return "—";
  const m = (Date.now() - new Date(iso)) / 60000;
  if (m < 60) return Math.max(1, Math.round(m)) + "분 전";
  if (m < 1440) return Math.round(m / 60) + "시간 전";
  return Math.round(m / 1440) + "일 전";
}

const STAGES = [["🌰", "씨앗"], ["🌱", "새싹"], ["🌷", "꽃"], ["🌳", "나무"], ["🌲", "숲"]];
const STATUS = {"노출": ["s-ok", "보여요"], "누락": ["s-miss", "빠졌어요"], "에러": ["s-err", "확인 실패"], "검색 비허용": ["s-off", "검색 꺼짐"]};
const FACTOR_COLOR = {exposure: "var(--coral)", keyword: "var(--sun)", pace: "var(--leaf)",
  consistency: "#5a8fb8", engagement: "#9a6bc0", visitors: "var(--ink-3)"};

function applyTheme(t) { if (t) document.documentElement.dataset.theme = t; }
try { applyTheme(localStorage.getItem("jjulog-theme")); } catch (e) {}
function toggleTheme() {
  const cur = document.documentElement.dataset.theme
    || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem("jjulog-theme", next); } catch (e) {}
}

async function load() {
  const get = p => fetch(p + "?t=" + Date.now()).then(r => r.ok ? r.json() : null).catch(() => null);
  const [latest, history] = await Promise.all([get("data/latest.json"), get("data/history.json")]);
  if (!latest || !latest.configured) return renderSetup(latest);
  render(latest, history || []);
}

function renderSetup(latest) {
  $("#app").innerHTML = `
    <div class="setup">
      <div class="logo hand">쭈로그<span>.</span></div>
      <p class="today">아직 어떤 블로그를 볼지 몰라요 🌰</p>
      <ol>
        <li>저장소의 <code>config.json</code> 에서 <code>"blog_id"</code> 에 블로그 아이디를 넣고 커밋</li>
        <li>몇 분 기다리면 자동으로 첫 수집이 돌아요 (Actions → 쭈로그 수집)</li>
        <li>이 페이지를 새로고침!</li>
      </ol>
      <p class="foot">${latest ? "마지막 확인 " + esc(new Date(latest.updated_at).toLocaleString("ko-KR")) : ""}</p>
    </div>`;
}

function memos(d) {
  const out = [], st = d.index.stats;
  const miss = d.posts.filter(p => p.status === "누락");
  const last = days(d.last_post);
  if (miss.length) out.push(["🔍", `검색에서 빠진 글이 ${miss.length}개 있어요. 아래 목록에서 빨간 글을 확인해 보세요.`]);
  else if (d.posts.length) out.push(["✨", `최근 글 ${d.posts.length}개가 모두 검색에 보여요.`]);
  if (last != null && last >= 7) out.push(["✏️", `마지막 글이 ${last}일 전이에요. 이번 주에 하나 써볼까요?`]);
  else if (last != null) out.push(["✏️", `마지막 글은 ${last === 0 ? "오늘" : last + "일 전"}. 주 평균 ${st.weekly_posts}개 쓰고 있어요.`]);
  const top = d.posts.filter(p => p.keyword && p.keyword.rank && p.keyword.rank <= 10);
  if (top.length) out.push(["🏆", `"${top[0].keyword.keyword}" 키워드에서 ${top[0].keyword.rank}위예요.`]);
  if (d.index.low_quality_risk) out.push(["⚠️", "최근 글 대부분이 검색에 안 보여요. 블로그 전체가 밀려났을 수 있어요."]);
  return out;
}

function render(d, history) {
  const idx = d.index, st = idx.stats, p = d.profile;
  const vis = d.visitors || [];
  const stage = Math.floor(idx.grade_index / 3), step = idx.grade_index % 3;
  const R = 86, C = 2 * Math.PI * R;
  const wsum = idx.factors.filter(f => f.value != null).reduce((a, f) => a + f.weight, 0) || 1;
  const prev = history.length > 1 ? history[history.length - 2].score : null;
  const diff = prev == null ? "" : (idx.score - prev >= 0 ? "▲" : "▼") + Math.abs(idx.score - prev).toFixed(1) + " 어제보다";
  const now = new Date();

  $("#app").innerHTML = `
  <div class="top">
    <div><div class="logo hand">쭈로그<span>.</span></div>
      <div class="today">${now.toLocaleDateString("ko-KR", {month: "long", day: "numeric", weekday: "long"})}의 내 블로그</div></div>
    <div class="top-r"><span>${esc(ago(d.updated_at))} 확인<br>${d.search_mode === "api" ? "API 모드" : "기본 모드"}</span>
      <button class="round-btn" onclick="toggleTheme()" aria-label="밝기 전환">☾</button></div>
  </div>

  <section class="hero">
    <div class="ring">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--stone)" stroke-width="14"/>
        <circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--coral)" stroke-width="14" stroke-linecap="round"
          stroke-dasharray="${C * idx.score / 100} ${C}"/>
      </svg>
      <div class="c"><b>${Math.round(idx.score)}</b><small>쭈로그 점수</small>${diff ? `<small>${diff}</small>` : ""}</div>
    </div>
    <div>
      <div class="who">${p.image ? `<img src="${esc(p.image)}" alt="" referrerpolicy="no-referrer">` : ""}
        <a href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.title)} · @${esc(d.blog_id)} ↗</a></div>
      <div class="stage hand">${STAGES[stage][0]} ${esc(idx.grade)} 단계</div>
      <div class="stage-sub">${stage < 4 ? `다음은 ${STAGES[stage + 1][1]}! 한 칸씩 자라는 중이에요.` : "가장 높은 숲 단계예요."}</div>
      <div class="path">${STAGES.map(([ic, nm], i) => `
        <div class="st ${i < stage ? "past" : i === stage ? "now" : ""}"><i>${ic}</i><span>${nm}</span>
          <div class="dots">${[0, 1, 2].map(k => `<u class="${i < stage || (i === stage && k <= step) ? "on" : ""}"></u>`).join("")}</div></div>`).join("")}
      </div>
      ${idx.low_quality_risk ? `<div class="warn">⚠ 검색 노출 경고</div>` : ""}
    </div>
  </section>

  <section class="memo"><h3 class="hand">오늘의 메모</h3>
    <ul>${memos(d).map(([i, t]) => `<li data-i="${i}">${esc(t)}</li>`).join("")}</ul></section>

  <section class="strip">
    <div><span>총 글</span><b>${fmt(d.total_posts)}</b></div>
    <div><span>검색 노출</span><b>${pct(st.exposure_rate)}</b></div>
    <div><span>주간 글</span><b>${st.weekly_posts}</b><em>개</em></div>
    <div><span>글당 댓글</span><b>${st.avg_comments}</b></div>
    <div><span>오늘 방문</span><b>${fmt(vis.length ? vis[vis.length - 1].count : null)}</b></div>
  </section>

  <div class="cols">
    <div>
      <section class="sec">
        <h3 class="hand">글 노출 체크 <span class="tabs" id="postF">
          <button data-s="all" class="on">전체</button><button data-s="노출">보여요</button><button data-s="누락">빠졌어요</button></span></h3>
        <div class="plist" id="postList"></div>
        <p class="foot">제목 그대로 블로그 검색(정확도·최신)에 넣어 확인해요. 시간에 따라 바뀔 수 있어요.</p>
      </section>
    </div>
    <div>
      <section class="sec">
        <h3 class="hand">점수는 이렇게 <small>합계 ${idx.score}</small></h3>
        <div class="mix" role="img" aria-label="점수 구성">${idx.factors.filter(f => f.value).map(f =>
          `<i style="width:${f.weight * f.value / wsum * 100}%;background:${FACTOR_COLOR[f.key]}" title="${esc(f.label)}"></i>`).join("")}</div>
        <div class="legend">${idx.factors.map(f => `<div><s style="background:${FACTOR_COLOR[f.key]}"></s><span>${esc(f.label)}</span>
          <b>${f.value == null ? "제외" : Math.round(f.value * f.weight) + " / " + f.weight}</b></div>`).join("")}</div>
      </section>
      <section class="sec">
        <h3 class="hand">방문자 <small>최근 5일</small></h3>
        <div class="chart" id="visits"></div>
      </section>
      <section class="sec">
        <h3 class="hand">관심 키워드</h3>
        ${d.watch_keywords.length ? `<table class="kwl">${d.watch_keywords.map(k => `<tr><td>${esc(k.keyword)}</td>
          <td>${k.error ? "확인 실패" : k.rank ? k.rank + "위" : `<span style="color:var(--ink-3);font-weight:400">순위 밖</span>`}</td></tr>`).join("")}</table>`
          : `<div class="empty">config.json 의 keywords 에 넣으면 매일 순위를 기록해요.</div>`}
      </section>
    </div>
  </div>

  <section class="sec">
    <h3 class="hand">쭈로그 기록 <span class="tabs" id="rangeF">
      <button data-r="30" class="on">한 달</button><button data-r="90">세 달</button><button data-r="0">전부</button></span></h3>
    <div class="chart" id="trend"></div>
  </section>
  <p class="foot">쭈로그 점수는 네이버 공식 등급이 아니에요. 매일의 흐름을 보는 나만의 기준이에요.</p>`;

  renderPosts(d.posts, "all");
  tabs("#postF", b => renderPosts(d.posts, b.dataset.s));

  const drawTrend = r => {
    const cut = r ? Date.now() - r * 864e5 : 0;
    const rows = history.filter(h => new Date(h.date) >= cut);
    lineChart($("#trend"), rows.map(h => ({x: h.date, y: h.score, label: `${h.date} · ${h.grade} · ${h.score}점 · 노출 ${pct(h.exposure_rate)}`})));
  };
  drawTrend(30);
  tabs("#rangeF", b => drawTrend(+b.dataset.r));

  barChart($("#visits"), vis.map(v => ({x: v.date.slice(5).replace("-", "/"), y: v.count, label: `${v.date} · ${fmt(v.count)}명`})));
}

function tabs(sel, fn) {
  $(sel).onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    [...$(sel).children].forEach(x => x.classList.toggle("on", x === b));
    fn(b);
  };
}

function renderPosts(posts, filter) {
  const rows = posts.filter(p => filter === "all" || p.status === filter);
  $("#postList").innerHTML = rows.length ? rows.map(p => {
    const [cls, txt] = STATUS[p.status] || ["s-off", p.status];
    const kw = p.keyword;
    const chip = kw ? `<span class="kwc ${kw.rank ? "" : "out"}">#${esc(kw.keyword)} ${kw.error ? "확인 실패" : kw.rank ? kw.rank + "위" : "순위 밖"}</span>` : "";
    return `<a class="post" href="${esc(p.url)}" target="_blank" rel="noopener"><span class="bar ${cls}"></span>
      <div style="min-width:0"><div class="tt">${esc(p.title)}</div>
      <div class="mt"><span class="tag ${cls}">${txt}</span><span>${esc(p.date.slice(5, 10).replace("-", "/"))}</span><span>💬 ${p.comments}</span>${chip}</div></div></a>`;
  }).join("") : `<div class="empty">해당하는 글이 없어요.</div>`;
}

// ---- 차트: 단일 시리즈, 호버 툴팁
const W = 600, H = 190, PAD = {l: 30, r: 10, t: 12, b: 24};

function grid(yMax, ticks) {
  const iy = v => PAD.t + (H - PAD.t - PAD.b) * (1 - v / yMax);
  return {iy, g: ticks.map(t => `<line class="gl" x1="${PAD.l}" x2="${W - PAD.r}" y1="${iy(t)}" y2="${iy(t)}"/><text class="ax" x="${PAD.l - 6}" y="${iy(t) + 4}" text-anchor="end">${fmt(t)}</text>`).join("")};
}

function hover(el, pts) {
  const tip = document.createElement("div"); tip.className = "tip"; el.appendChild(tip);
  const svg = el.querySelector("svg");
  svg.addEventListener("pointermove", e => {
    const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W;
    let best = pts[0]; pts.forEach(p => { if (Math.abs(p.cx - x) < Math.abs(best.cx - x)) best = p; });
    tip.textContent = best.label; tip.style.opacity = 1;
    tip.style.left = best.cx / W * r.width + "px"; tip.style.top = best.cy / H * r.height + "px";
  });
  svg.addEventListener("pointerleave", () => tip.style.opacity = 0);
}

function lineChart(el, data) {
  if (!data.length) { el.innerHTML = `<div class="empty">하루하루 기록이 쌓이면 여기에 그려져요.</div>`; return; }
  const {iy, g} = grid(100, [0, 50, 100]);
  const ix = i => data.length === 1 ? (PAD.l + W - PAD.r) / 2 : PAD.l + (W - PAD.l - PAD.r) * i / (data.length - 1);
  const pts = data.map((d, i) => ({...d, cx: ix(i), cy: iy(d.y)}));
  const line = pts.map((p, i) => (i ? "L" : "M") + p.cx + " " + p.cy).join(" ");
  const area = line + ` L${pts[pts.length - 1].cx} ${iy(0)} L${pts[0].cx} ${iy(0)} Z`;
  const last = pts[pts.length - 1];
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="쭈로그 점수 기록">${g}
    ${pts.length > 1 ? `<path d="${area}" fill="var(--coral-soft)" opacity=".7"/>` : ""}
    <path d="${line}" fill="none" stroke="var(--coral)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last.cx}" cy="${last.cy}" r="5" fill="var(--coral)" stroke="var(--card)" stroke-width="2"/>
    <text class="ax" x="${PAD.l}" y="${H - 6}">${esc(data[0].x.slice(5).replace("-", "/"))}</text>
    <text class="ax" x="${W - PAD.r}" y="${H - 6}" text-anchor="end">${esc(last.x.slice(5).replace("-", "/"))}</text>
    <rect width="${W}" height="${H}" fill="transparent"/></svg>`;
  hover(el, pts);
}

function barChart(el, data) {
  if (!data.length) { el.innerHTML = `<div class="empty">방문자 카운터가 비공개라 볼 수 없어요.</div>`; return; }
  const top = Math.ceil(Math.max(...data.map(d => d.y), 1) * 1.15);
  const {iy, g} = grid(top, [0, top]);
  const slot = (W - PAD.l - PAD.r) / data.length, bw = Math.min(40, slot - 2);
  const pts = data.map((d, i) => ({...d, cx: PAD.l + slot * (i + .5), cy: iy(d.y)}));
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 방문자 수">${g}
    ${pts.map(p => { const h = H - PAD.b - p.cy, r = Math.min(4, h);
      return `<path d="M${p.cx - bw / 2} ${H - PAD.b} V${p.cy + r} q0 -${r} ${r} -${r} H${p.cx + bw / 2 - r} q${r} 0 ${r} ${r} V${H - PAD.b}Z" fill="var(--leaf)"/>
      <text class="ax" x="${p.cx}" y="${H - 6}" text-anchor="middle">${esc(p.x)}</text>`; }).join("")}
    <rect width="${W}" height="${H}" fill="transparent"/></svg>`;
  hover(el, pts);
}

load();
</script>

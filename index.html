<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>쭈로그</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --paper:#fbf6ee; --card:#fffdf9; --card-2:#f5ede1; --rule:#eadfce;
  --ink:#2e2520; --ink-2:#6b5d52; --ink-3:#a39385;
  --coral:#e2603f; --coral-soft:#fbe3da;
  --leaf:#3f8f5a; --leaf-soft:#e1f1e5;
  --sun:#c98a12; --sun-soft:#fbefd2;
  --plum:#b2344a; --plum-soft:#f8dde2;
  --sky:#3f77a8; --sky-soft:#e0ecf7;
  --stone:#ece4d8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1b1714; --card:#241f1b; --card-2:#2e2823; --rule:#3a322b;
    --ink:#f3ebe2; --ink-2:#c7b8aa; --ink-3:#8e7f72;
    --coral:#ff8a6a; --coral-soft:#4a2a20;
    --leaf:#6fcb8d; --leaf-soft:#1f3a28;
    --sun:#f2b84b; --sun-soft:#3f3115;
    --plum:#ff7d93; --plum-soft:#4a2028;
    --sky:#7fb5e6; --sky-soft:#1d3044;
    --stone:#352e28;
  }
}
:root[data-theme="dark"]{
  --paper:#1b1714; --card:#241f1b; --card-2:#2e2823; --rule:#3a322b;
  --ink:#f3ebe2; --ink-2:#c7b8aa; --ink-3:#8e7f72;
  --coral:#ff8a6a; --coral-soft:#4a2a20;
  --leaf:#6fcb8d; --leaf-soft:#1f3a28;
  --sun:#f2b84b; --sun-soft:#3f3115;
  --plum:#ff7d93; --plum-soft:#4a2028;
  --sky:#7fb5e6; --sky-soft:#1d3044;
  --stone:#352e28;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.6}
a{color:inherit}
.hand{font-family:"Gowun Dodum","Noto Sans KR",sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:28px 16px 72px}

/* 상단 */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:18px;border-bottom:2px dashed var(--rule);margin-bottom:26px}
.logo{font-size:34px;line-height:1;font-weight:400}
.logo span{color:var(--coral)}
.today{color:var(--ink-2);font-size:14px;margin-top:6px}
.top-r{display:flex;gap:8px;align-items:center;color:var(--ink-3);font-size:12px;text-align:right}
.round-btn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--rule);background:var(--card);color:var(--ink-2);cursor:pointer;font-size:15px}

/* 히어로 */
.hero{display:grid;grid-template-columns:200px 1fr;gap:28px;align-items:center;background:var(--card);border-radius:28px;padding:26px;box-shadow:0 1px 0 var(--rule),0 12px 30px -18px rgba(90,50,20,.25)}
@media (max-width:680px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}}
.ring{position:relative;width:190px;height:190px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:46px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.ring .c small{color:var(--ink-3);font-size:12px;margin-top:4px}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (max-width:680px){.who{justify-content:center}}
.who img{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--card-2)}
.who a{color:var(--ink-2);font-size:14px;text-decoration:none}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--card-2);color:var(--ink-2)}
.pill.mate{background:var(--sky-soft);color:var(--sky)}
.grade{font-size:44px;line-height:1.15;margin:8px 0 2px}
.grade-sub{color:var(--ink-2);font-size:14px}
.track{display:grid;grid-template-columns:repeat(15,1fr);gap:3px;margin-top:16px}
.track i{height:10px;border-radius:5px;background:var(--stone)}
.track i.on{background:var(--coral)}
.track i.now{outline:2px solid var(--coral);outline-offset:2px}
.track-l{display:grid;grid-template-columns:1fr 7fr 3fr 4fr;font-size:11px;color:var(--ink-3);margin-top:6px;text-align:left}
.warn{display:inline-block;margin-top:14px;background:var(--plum-soft);color:var(--plum);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}

/* 다음 레벨 로드맵 */
.road{margin-top:22px;background:var(--card);border-radius:24px;padding:22px}
.road h3{margin:0 0 4px;font-size:20px;font-weight:400}
.road .lead{color:var(--ink-2);font-size:14px;margin:0 0 14px}
.road .lead b{color:var(--coral)}
.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.path{background:var(--paper);border-radius:16px;padding:14px;border:2px solid transparent}
.path.best{border-color:var(--coral)}
.path .lbl{font-size:13px;font-weight:700;line-height:1.4;min-height:36px}
.path .when{font-size:26px;font-weight:900;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.path .when.never{font-size:16px;color:var(--ink-3);font-weight:700}
.path .after{font-size:12px;color:var(--ink-3)}
.path .after b{color:var(--ink-2);font-weight:500}
.levers{margin-top:16px;display:grid;gap:6px}
.levers div{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;font-size:13px}
.levers b{text-align:right;color:var(--leaf);font-variant-numeric:tabular-nums}
.levers span{color:var(--ink-2)}

/* 숫자 줄 */
.strip{display:grid;grid-template-columns:repeat(6,1fr);background:var(--card);border-radius:20px;overflow:hidden;margin:22px 0}
@media (max-width:760px){.strip{grid-template-columns:repeat(3,1fr)}}
.strip div{padding:14px 16px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.strip span{display:block;font-size:12px;color:var(--ink-3)}
.strip b{font-size:21px;font-weight:900;font-variant-numeric:tabular-nums}
.strip em{font-style:normal;font-size:12px;color:var(--ink-2);margin-left:3px}

.cols{display:grid;grid-template-columns:1.5fr 1fr;gap:22px}
.cols > div,.hero > div{min-width:0}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.sec{background:var(--card);border-radius:24px;padding:22px;min-width:0;margin-bottom:22px}
.sec h3{margin:0 0 14px;font-size:20px;font-weight:400;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sec h3 small{font-family:"Noto Sans KR";font-size:12px;color:var(--ink-3)}

/* 진단 */
.diag{display:grid;gap:8px}
.diag div{display:grid;grid-template-columns:28px 1fr;gap:4px 10px;padding:10px 12px;border-radius:14px;background:var(--paper)}
.diag i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:900}
.diag .good i{background:var(--leaf-soft);color:var(--leaf)}
.diag .warn i{background:var(--sun-soft);color:var(--sun)}
.diag .bad i{background:var(--plum-soft);color:var(--plum)}
.diag b{font-weight:700;font-size:14px}
.diag p{grid-column:2;margin:0;font-size:13px;color:var(--ink-2)}

.tabs{display:inline-flex;background:var(--card-2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.tabs button{border:0;background:none;color:var(--ink-2);border-radius:999px;padding:4px 11px;font:inherit;font-size:12px;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* 글 카드 */
.plist{display:grid;gap:10px}
.post{background:var(--paper);border-radius:16px;padding:12px 14px}
.post summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.post summary::-webkit-details-marker{display:none}
.post .tt{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.post .mt{display:flex;flex-wrap:wrap;gap:5px 8px;font-size:12px;color:var(--ink-3);align-items:center;margin-top:4px}
.opt{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:15px;font-variant-numeric:tabular-nums;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--stone) 0)}
.opt span{width:36px;height:36px;border-radius:50%;background:var(--paper);display:grid;place-items:center}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:0 7px}
.s-ok{background:var(--leaf-soft);color:var(--leaf)}.s-miss{background:var(--plum-soft);color:var(--plum)}
.s-err{background:var(--sun-soft);color:var(--sun)}.s-off{background:var(--stone);color:var(--ink-2)}
.s-tot{background:var(--sky-soft);color:var(--sky)}
.kwc{border:1px solid var(--rule);border-radius:999px;padding:0 8px;color:var(--ink-2)}
.kwc b{color:var(--coral)}
.kwc.out b{color:var(--ink-3);font-weight:400}
.detail{margin-top:12px;padding-top:12px;border-top:1px dashed var(--rule);display:grid;gap:10px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}
.metrics div{background:var(--card);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--ink-3)}
.metrics b{display:block;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.tips{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.go{font-size:12px;color:var(--coral);text-decoration:none;font-weight:700}

/* 점수 구성 */
.mix{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px;background:var(--stone)}
.mix i{display:block;height:100%}
.legend{display:grid;gap:7px;margin-top:14px;font-size:13px}
.legend div{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center}
.legend s{width:12px;height:12px;border-radius:4px;display:block}
.legend b{font-variant-numeric:tabular-nums;font-weight:500;color:var(--ink-2)}

/* 키워드 표 */
.kwt{width:100%;border-collapse:collapse;font-size:13px}
.kwt th{font-weight:500;color:var(--ink-3);text-align:right;padding:4px 0;font-size:12px}
.kwt th:first-child,.kwt td:first-child{text-align:left}
.kwt td{padding:7px 0;border-top:1px dashed var(--rule);text-align:right;font-variant-numeric:tabular-nums}
.kwt td.r{font-weight:700;color:var(--coral)}
.kwt td.r.out{color:var(--ink-3);font-weight:400}
.comp{font-size:11px;border-radius:5px;padding:0 6px}
.c-low{background:var(--leaf-soft);color:var(--leaf)}.c-mid{background:var(--sun-soft);color:var(--sun)}.c-high{background:var(--plum-soft);color:var(--plum)}

/* 경쟁 블로그 */
.rival-head{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-bottom:16px}
@media (max-width:680px){.rival-head{grid-template-columns:1fr}}
.rival-big{font-size:40px;line-height:1.1}
.rival-big small{font-size:16px;color:var(--ink-3);font-family:"Noto Sans KR"}
.places{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:680px){.places{grid-template-columns:repeat(2,1fr)}}
.places div{background:var(--paper);border-radius:12px;padding:8px 12px;font-size:12px;color:var(--ink-3)}
.places b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.places em{font-style:normal;font-size:11px;color:var(--ink-3)}
.rt-wrap{overflow-x:auto}
.rt{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
.rt th{font-weight:500;color:var(--ink-3);font-size:12px;text-align:right;padding:6px 8px;white-space:nowrap}
.rt th:nth-child(2),.rt td:nth-child(2){text-align:left}
.rt td{padding:8px;border-top:1px dashed var(--rule);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rt td:nth-child(2){white-space:normal;max-width:260px}
.rt tr.me td{background:var(--coral-soft)}
.rt tr.me td:first-child{border-radius:10px 0 0 10px}.rt tr.me td:last-child{border-radius:0 10px 10px 0}
.rt a{text-decoration:none;font-weight:500}
.rt .sub{display:block;font-size:11px;color:var(--ink-3)}
.wbar{display:inline-block;width:60px;height:6px;border-radius:3px;background:var(--stone);vertical-align:middle;margin-left:6px;overflow:hidden}
.wbar i{display:block;height:100%;background:var(--coral);border-radius:0 3px 3px 0}

/* 인기 글 */
.top-l{display:grid;gap:8px;counter-reset:n}
.tp{display:grid;grid-template-columns:28px 56px 1fr auto;gap:12px;align-items:center;background:var(--paper);border-radius:16px;padding:10px 14px 10px 10px;text-decoration:none}
.tp .no{font-size:20px;font-weight:900;text-align:center;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tp:nth-child(-n+3) .no{color:var(--coral)}
.tp .th{width:56px;height:56px;border-radius:12px;background:var(--card-2);object-fit:cover;display:block}
.tp .tt{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp .mt{font-size:12px;color:var(--ink-3);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.tp .nums{display:flex;gap:12px;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.tp .nums b{color:var(--ink);font-weight:700}
.tp .nums .hi b{color:var(--coral)}
.tp .bar{grid-column:3 / -1;height:4px;border-radius:2px;background:var(--stone);overflow:hidden;margin-top:-4px}
.tp .bar i{display:block;height:100%;background:var(--coral)}
@media (max-width:600px){.tp{grid-template-columns:24px 44px 1fr}.tp .th{width:44px;height:44px}.tp .nums{grid-column:3}.tp .bar{grid-column:3}}
.top-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.top-sum div{background:var(--paper);border-radius:12px;padding:8px 12px;font-size:12px;color:var(--ink-3)}
.top-sum b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}

.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--rule);stroke-width:1;stroke-dasharray:2 4}
.chart .ax{fill:var(--ink-3);font-size:11px;font-family:"Noto Sans KR"}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;padding:5px 9px;border-radius:10px;white-space:nowrap;transform:translate(-50%,-115%);opacity:0;transition:opacity .1s}
.empty{color:var(--ink-3);font-size:13px;text-align:center;padding:18px 0}
.foot{color:var(--ink-3);font-size:12px;text-align:center;margin-top:10px}
.note{font-size:12px;color:var(--ink-3);margin:10px 0 0}
.setup{max-width:560px;margin:60px auto;text-align:center}
.setup ol{text-align:left;background:var(--card);border-radius:20px;padding:20px 20px 20px 40px}
.setup code{background:var(--card-2);padding:1px 6px;border-radius:5px}

/* 잠금 화면 */
.gate{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
.gate form{width:100%;max-width:260px}
.gate input{width:100%;background:#000;color:#fff;border:0;border-bottom:1px solid #444;padding:10px 2px;font:inherit;font-size:18px;text-align:center;letter-spacing:.3em;outline:none}
.gate input:focus{border-bottom-color:#999}
.gate.bad input{border-bottom-color:#a33;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>
<body>
<div class="gate" id="gate"><form id="gateForm" autocomplete="off">
  <input id="pw" type="password" aria-label="암호" autofocus>
</form></div>
<div class="wrap" id="app"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n == null ? "—" : n >= 10000 ? (n / 10000).toFixed(1).replace(/\.0$/, "") + "만" : n.toLocaleString("ko-KR");
const pct = v => v == null ? "—" : Math.round(v * 100) + "%";
// 달력 기준 며칠 전인지 (어제 쓴 글은 1)
const days = iso => iso ? Math.round((new Date().setHours(0, 0, 0, 0) - new Date(iso).setHours(0, 0, 0, 0)) / 864e5) : null;

function ago(iso) {
  if (!iso) return "—";
  const m = (Date.now() - new Date(iso)) / 60000;
  if (m < 60) return Math.max(1, Math.round(m)) + "분 전";
  if (m < 1440) return Math.round(m / 60) + "시간 전";
  return Math.round(m / 1440) + "일 전";
}

const BLOG_TAB = {"노출": ["s-ok", "블로그탭 노출"], "누락": ["s-miss", "블로그탭 누락"], "에러": ["s-err", "확인 실패"], "검색 비허용": ["s-off", "검색 꺼짐"]};
const FACTOR_COLOR = {visitors: "var(--coral)", keyword: "var(--sun)", exposure: "var(--leaf)", total: "var(--sky)",
  pace: "#9a6bc0", consistency: "#7a9a3a", engagement: "#c0577f", content: "var(--ink-3)"};
const COMP = {"낮음": "c-low", "중간": "c-mid", "높음": "c-high"};

function applyTheme(t) { if (t) document.documentElement.dataset.theme = t; }
try { applyTheme(localStorage.getItem("jjulog-theme")); } catch (e) {}
function toggleTheme() {
  const cur = document.documentElement.dataset.theme
    || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem("jjulog-theme", next); } catch (e) {}
}

async function load() {
  const get = p => fetch(p + "?t=" + Date.now()).then(r => r.ok ? r.json() : null).catch(() => null);
  const [latest, history, visitors] = await Promise.all([get("data/latest.json"), get("data/history.json"), get("data/visitors.json")]);
  if (!latest || !latest.configured) return renderSetup(latest);
  render(latest, history || [], (visitors || []).filter(v => !v.blog_id || v.blog_id === latest.blog_id));
}

function renderSetup(latest) {
  $("#app").innerHTML = `
    <div class="setup">
      <div class="logo hand">쭈로그<span>.</span></div>
      <p class="today">아직 어떤 블로그를 볼지 몰라요</p>
      <ol>
        <li>저장소의 <code>config.json</code> 에서 <code>"blog_id"</code> 에 블로그 아이디를 넣고 커밋</li>
        <li>몇 분 기다리면 자동으로 첫 수집이 돌아요 (Actions → 쭈로그 수집)</li>
        <li>이 페이지를 새로고침!</li>
      </ol>
      <p class="foot">${latest ? "마지막 확인 " + esc(new Date(latest.updated_at).toLocaleString("ko-KR")) : ""}</p>
    </div>`;
}

function kwChip(k) {
  const r = k.error ? "확인 실패" : k.rank ? k.rank + "위" : "순위 밖";
  return `<span class="kwc ${k.rank ? "" : "out"}">#${esc(k.keyword)} <b>${r}</b></span>`;
}

function render(d, history, vseries) {
  const idx = d.index, st = idx.stats, p = d.profile, info = d.info || {};
  const R = 80, C = 2 * Math.PI * R;
  const wsum = idx.factors.filter(f => f.value != null).reduce((a, f) => a + f.weight, 0) || 1;
  const prev = history.length > 1 ? history[history.length - 2].score : null;
  const diff = prev == null ? "" : (idx.score - prev >= 0 ? "▲ " : "▼ ") + Math.abs(idx.score - prev).toFixed(1) + " 어제보다";
  const next = idx.grades[idx.grade_index + 1];
  const nextAt = idx.grade_at ? idx.grade_at[idx.grade_index + 1] : (idx.grade_index + 1) / 15 * 100;
  const toNext = next ? Math.max(0, nextAt - idx.score).toFixed(1) : null;
  const allKw = [...d.posts.flatMap(x => (x.keywords || []).map(k => ({...k, post: x.title}))), ...d.watch_keywords.map(k => ({...k, watch: true}))];
  const hasVol = allKw.some(k => k.volume), hasDocs = allKw.some(k => k.docs);

function gradeAt(idx, score) {
  const at = idx.grade_at || idx.grades.map((_, i) => i / 15 * 100);
  let g = 0; at.forEach((v, i) => { if (score >= v) g = i; });
  return idx.grades[g];
}

function roadmap(idx) {
  const p = idx.plan;
  const reach = p.scenarios.filter(s => s.weeks);
  const best = reach.length ? reach.reduce((a, b) => (a.per_week <= b.per_week ? a : b)) : null;
  const when = w => w == null ? "6개월 안엔 어려워요" : w <= 1 ? "약 1주" : `약 ${w}주`;
  return `<section class="road">
    <h3 class="hand">${esc(p.next_grade)}까지 이렇게 하면</h3>
    <p class="lead">지금 ${idx.score}점 · ${esc(p.next_grade)} 기준 ${p.next_at}점 — <b>${p.need}점</b> 더 필요해요.
      ${best ? `가장 현실적인 길은 <b>${esc(best.label)}</b> — <b>${when(best.weeks)}</b>.` : ""}</p>
    <div class="paths">${p.scenarios.map(s => `<div class="path ${s === best ? "best" : ""}">
      <div class="lbl">${esc(s.label)}</div>
      <div class="when ${s.weeks ? "" : "never"}">${when(s.weeks)}</div>
      <div class="after">4주 뒤 <b>${s.after_4w}점 · ${esc(gradeAt(idx, s.after_4w))}</b><br>12주 뒤 <b>${s.after_12w}점 · ${esc(gradeAt(idx, s.after_12w))}</b></div>
    </div>`).join("")}</div>
    ${p.levers.length ? `<div class="levers">${p.levers.map(l => `<div><b>+${l.gain}점</b><span>${esc(l.how)} <small style="color:var(--ink-3)">(${esc(l.label)})</small></span></div>`).join("")}</div>` : ""}
    <p class="note">매일 아침 오늘 데이터로 다시 계산해요. 방문자·노출률은 지금 그대로라고 보고 발행과 키워드만 바꿔 본 쭈로그 기준 예상이에요. 실제 네이버 반영은 보통 2~4주 늦게 따라와요.</p>
  </section>`;
}

const RIVAL_SORT ={score: "체급", visitors_avg: "하루 방문", subscribers: "구독자", posts_30d: "30일 발행"};

  $("#rivals").innerHTML = `
    <h3 class="hand">경쟁 블로그 <span class="tabs" id="rivalF">${Object.entries(RIVAL_SORT).map(([k, v], i) =>
      `<button data-k="${k}" class="${i ? "" : "on"}">${v}순</button>`).join("")}</span></h3>
    <div class="rival-head">
      <div class="rival-big hand">${c.my_rank}위 <small>/ ${c.count}곳 · 상위 ${c.top_percent}%${move ? ` · 어제보다 ${move > 0 ? "▲" : "▼"}${Math.abs(move)}` : ""}</small></div>
      <div class="places">
        ${place("하루 방문", pl.visitors_avg, me.visitors_avg ?? me.today_visitors, avg.visitors_avg, "명")}

        ${place("최근 30일 글", pl.posts_30d, me.posts_30d, avg.posts_30d, "개")}
        ${place("누적 글", pl.total_posts, me.total_posts, avg.total_posts, "개")}
      </div>
    </div>
    <div class="rt-wrap"><table class="rt" id="rivalT"></table></div>
    <p class="note">내 글 키워드로 검색했을 때 30위 안에 함께 뜬 블로그 중 자주 겹치는 ${c.count - 1}곳${c.same_topic ? ` (같은 주제 ${c.same_topic}곳)` : ""}과 비교했어요.
      체급 = 하루 방문 50 · 구독자 20 · 최근 30일 발행 20 · 누적 글 10. 비공개 방문자는 오늘 방문자로 대신 계산해요.</p>`;
  const draw = key => {
    const rows = [...c.blogs].sort((a, b) => ((b[key] ?? b.today_visitors ?? 0) - (a[key] ?? a.today_visitors ?? 0)));
    $("#rivalT").innerHTML = `<tr><th>#</th><th>블로그</th><th>체급</th><th>하루 방문</th><th>구독자</th><th>30일 글</th><th>누적 글</th></tr>` +
      rows.map((b, i) => `<tr class="${b.me ? "me" : ""}"><td>${i + 1}</td>
        <td><a href="https://blog.naver.com/${esc(b.blog_id)}" target="_blank" rel="noopener">${esc(b.name || b.blog_id)}</a>${b.me ? " (나)" : ""}
          <span class="sub">${esc(b.topic || "")}${b.shared.length ? ` · 겹친 키워드 ${b.shared.length}개: ${b.shared.slice(0, 3).map(s => esc(s.keyword) + " " + s.rank + "위").join(", ")}` : ""}</span></td>
        <td>${b.score}<span class="wbar"><i style="width:${b.score}%"></i></span></td>
        <td>${b.visitors_avg != null ? fmt(Math.round(b.visitors_avg)) : `<span title="방문자 비공개 — 오늘 방문">${fmt(b.today_visitors)}*</span>`}</td>
        <td>${fmt(b.subscribers)}</td><td>${fmt(b.posts_30d)}</td><td>${fmt(b.total_posts)}</td></tr>`).join("");

// 인기 글: 종합 = 기간 안 최댓값 대비 공감 + 댓글 (+ 조회수 공개 시) 평균
function renderTop(all) {
  const hasViews = all.some(p => p.views != null);
  const SORT = {score: "종합", likes: "공감", comments: "댓글", ...(hasViews ? {views: "조회수"} : {})};
  let key = "score", range = 90;
  $("#topPosts").innerHTML = `
    <h3 class="hand">인기 글 TOP 10
      <span style="display:flex;gap:6px;flex-wrap:wrap">
        <span class="tabs" id="topK">${Object.entries(SORT).map(([k, v], i) => `<button data-k="${k}" class="${i ? "" : "on"}">${v}</button>`).join("")}</span>
        <span class="tabs" id="topR"><button data-r="30">한 달</button><button data-r="90" class="on">세 달</button><button data-r="0">전부</button></span>
      </span></h3>
    <div class="top-sum" id="topSum"></div>
    <div class="top-l" id="topL"></div>
    <p class="note">공개 글 ${all.length}개 기준 · 종합 = 공감·댓글${hasViews ? "·조회수" : ""}을 기간 안 1등 대비 비율로 바꿔 평균 낸 값(100 = 전부 1등).
      댓글 수에는 내가 단 답글도 포함돼요.${hasViews ? "" : " 조회수는 네이버가 공개하지 않아(블로그 조회수 비공개) 빠져 있어요."}</p>`;
  const draw = () => {
    const cut = range ? Date.now() - range * 864e5 : 0;
    const rows = all.filter(p => !p.date || new Date(p.date) >= cut);
    const metrics = ["likes", "comments", ...(hasViews ? ["views"] : [])];
    const max = Object.fromEntries(metrics.map(m => [m, Math.max(1, ...rows.map(p => p[m] || 0))]));
    rows.forEach(p => p.score = Math.round(metrics.reduce((a, m) => a + (p[m] || 0) / max[m], 0) / metrics.length * 100));
    const sum = m => rows.reduce((a, p) => a + (p[m] || 0), 0);
    const avg = m => rows.length ? (sum(m) / rows.length).toFixed(1) : "—";
    $("#topSum").innerHTML = `<div>글<b>${rows.length}개</b></div><div>평균 공감<b>${avg("likes")}</b></div><div>평균 댓글<b>${avg("comments")}</b></div>`;
    const top = [...rows].sort((a, b) => (b[key] || 0) - (a[key] || 0) || (b.score - a.score)).slice(0, 10);
    const topMax = Math.max(1, top[0]?.[key] || 0);
    $("#topL").innerHTML = top.length ? top.map((p, i) => `<a class="tp" href="${esc(p.url)}" target="_blank" rel="noopener">
      <span class="no">${i + 1}</span>
      ${p.thumb ? `<img class="th" src="${esc(p.thumb.replace(/^http:/, "https:"))}?type=s100" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'th'}))">` : `<span class="th"></span>`}
      <div style="min-width:0"><div class="tt">${esc(p.title)}</div>
        <div class="mt"><span>${p.date ? esc(p.date.slice(2, 10).replace(/-/g, ".")) : ""}</span>${p.category ? `<span>${esc(p.category)}</span>` : ""}<span>종합 ${p.score}</span></div></div>
      <div class="nums"><span class="${key === "likes" ? "hi" : ""}">♥ <b>${fmt(p.likes)}</b></span><span class="${key === "comments" ? "hi" : ""}">💬 <b>${fmt(p.comments)}</b></span>${hasViews ? `<span class="${key === "views" ? "hi" : ""}">👁 <b>${fmt(p.views)}</b></span>` : ""}</div>
      <div class="bar"><i style="width:${(p[key] || 0) / topMax * 100}%"></i></div>
    </a>`).join("") : `<div class="empty">이 기간에 쓴 글이 없어요.</div>`;
  };
  draw();
  tabs("#topK", b => { key = b.dataset.k; draw(); });
  tabs("#topR", b => { range = +b.dataset.r; draw(); });
}

function tabs(sel, fn) {
  $(sel).onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    [...$(sel).children].forEach(x => x.classList.toggle("on", x === b));
    fn(b);
  };
}

const POST_FILTER = {
  all: () => true,
  miss: p => p.status === "누락",
  nototal: p => p.total_search === "미노출",

};

    const c = p.content;
    const color = !c ? "var(--stone)" : c.score >= 90 ? "var(--leaf)" : c.score >= 70 ? "var(--sun)" : "var(--plum)";
    return `<details class="post"><summary>
      <div style="min-width:0"><div class="tt">${esc(p.title)}</div>
        <div class="mt"><span class="tag ${cls}">${txt}</span>${tot}<span>${esc(p.date.slice(5, 10).replace("-", "/"))}</span>${p.likes != null ? `<span>♥ ${p.likes}</span>` : ""}<span>💬 ${p.comments}</span>
        ${(p.keywords || []).map(kwChip).join("")}</div></div>
      <div class="opt" style="--p:${c ? c.score : 0};--c:${color}" title="글 최적화 점수"><span>${c ? c.score : "—"}</span></div>
    </summary>
    <div class="detail">
      ${c ? `<div class="metrics">
        <div>글자 수<b>${fmt(c.chars)}</b></div><div>사진<b>${c.images}</b></div><div>동영상<b>${c.videos}</b></div>
        <div>인용·소제목<b>${c.quotes + c.headings}</b></div><div>링크<b>${c.links}</b></div><div>제목 길이<b>${c.title_len}</b></div>
        <div>키워드 반복<b>${c.kw_count ?? "—"}</b></div></div>
        ${c.tips.length ? `<ul class="tips">${c.tips.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : `<div class="note">최적화 체크를 모두 통과했어요 👍</div>`}`
        : `<div class="note">본문을 읽지 못했어요.</div>`}
      <a class="go" href="${esc(p.url)}" target="_blank" rel="noopener">글 열기 ↗</a>
    </div></details>`;
  }).join("") : `<div class="empty">해당하는 글이 없어요.</div>`;
}

// ---- 차트: 단일 시리즈, 호버 툴팁
const W = 600, H = 190, PAD = {l: 34, r: 10, t: 12, b: 24};

function grid(yMax, ticks) {
  const iy = v => PAD.t + (H - PAD.t - PAD.b) * (1 - v / yMax);
  return {iy, g: ticks.map(t => `<line class="gl" x1="${PAD.l}" x2="${W - PAD.r}" y1="${iy(t)}" y2="${iy(t)}"/><text class="ax" x="${PAD.l - 6}" y="${iy(t) + 4}" text-anchor="end">${fmt(t)}</text>`).join("")};
}

function hover(el, pts) {
  const tip = document.createElement("div"); tip.className = "tip"; el.appendChild(tip);
  const svg = el.querySelector("svg");
  svg.addEventListener("pointermove", e => {
    const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W;
    let best = pts[0]; pts.forEach(p => { if (Math.abs(p.cx - x) < Math.abs(best.cx - x)) best = p; });
    tip.textContent = best.label; tip.style.opacity = 1;
    tip.style.left = best.cx / W * r.width + "px"; tip.style.top = best.cy / H * r.height + "px";
  });
  svg.addEventListener("pointerleave", () => tip.style.opacity = 0);
}

function lineChart(el, data) {
  if (!data.length) { el.innerHTML = `<div class="empty">하루하루 기록이 쌓이면 여기에 그려져요.</div>`; return; }
  const {iy, g} = grid(100, [0, 50, 100]);
  const ix = i => data.length === 1 ? (PAD.l + W - PAD.r) / 2 : PAD.l + (W - PAD.l - PAD.r) * i / (data.length - 1);
  const pts = data.map((d, i) => ({...d, cx: ix(i), cy: iy(d.y)}));
  const line = pts.map((p, i) => (i ? "L" : "M") + p.cx + " " + p.cy).join(" ");
  const area = line + ` L${pts[pts.length - 1].cx} ${iy(0)} L${pts[0].cx} ${iy(0)} Z`;
  const last = pts[pts.length - 1];
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="쭈로그 점수 기록">${g}
    ${pts.length > 1 ? `<path d="${area}" fill="var(--coral-soft)" opacity=".7"/>` : ""}
    <path d="${line}" fill="none" stroke="var(--coral)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last.cx}" cy="${last.cy}" r="5" fill="var(--coral)" stroke="var(--card)" stroke-width="2"/>
    <text class="ax" x="${PAD.l}" y="${H - 6}">${esc(data[0].x.slice(5).replace("-", "/"))}</text>
    <text class="ax" x="${W - PAD.r}" y="${H - 6}" text-anchor="end">${esc(last.x.slice(5).replace("-", "/"))}</text>
    <rect width="${W}" height="${H}" fill="transparent"/></svg>`;
  hover(el, pts);
}

function barChart(el, data) {
  if (!data.length) { el.innerHTML = `<div class="empty">방문자 카운터가 비공개라 볼 수 없어요.</div>`; return; }
  const top = Math.ceil(Math.max(...data.map(d => d.y), 1) * 1.15);
  const {iy, g} = grid(top, [0, top]);
  const slot = (W - PAD.l - PAD.r) / data.length, bw = Math.max(2, Math.min(36, slot - 2));
  const every = Math.ceil(data.length / 8);
  const pts = data.map((d, i) => ({...d, cx: PAD.l + slot * (i + .5), cy: iy(d.y)}));
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="방문자 수">${g}
    ${pts.map((p, i) => { const h = H - PAD.b - p.cy, r = Math.min(4, h, bw / 2);
      return `<path d="M${p.cx - bw / 2} ${H - PAD.b} V${p.cy + r} q0 -${r} ${r} -${r} H${p.cx + bw / 2 - r} q${r} 0 ${r} ${r} V${H - PAD.b}Z" fill="var(--leaf)"/>
      ${(data.length - 1 - i) % every === 0 ? `<text class="ax" x="${p.cx}" y="${H - 6}" text-anchor="middle">${esc(p.x)}</text>` : ""}`; }).join("")}
    <rect width="${W}" height="${H}" fill="transparent"/></svg>`;
  hover(el, pts);
}

// ---- 잠금: 암호 원문 대신 PBKDF2 해시만 비교
const GATE_HASH = "c9d57b29959807cdfb9c8c1001ea9596807330c749c179fe11af1bf0776af44a";

async function hashPw(pw) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    {name: "PBKDF2", hash: "SHA-256", salt: enc.encode("jjulog-gate"), iterations: 200000}, key, 256);
  return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, "0")).join("");
}

function unlock() {
  $("#gate").remove();
  $("#app").innerHTML = `<div class="empty hand">쭈로그를 펼치는 중…</div>`;
  load();
}

let unlocked = false;
try { unlocked = sessionStorage.getItem("jjulog-gate") === GATE_HASH; } catch (e) {}
if (unlocked) unlock();
else $("#gateForm").onsubmit = async e => {
  e.preventDefault();
  const gate = $("#gate"), h = await hashPw($("#pw").value);
  if (h !== GATE_HASH) {
    gate.classList.remove("bad"); void gate.offsetWidth; gate.classList.add("bad");
    $("#pw").value = "";
    return;
  }
  try { sessionStorage.setItem("jjulog-gate", h); } catch (e) {}
  unlock();
};
</script>

name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          exec > probe.txt 2>&1
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          curl -s -A "$UA" -e https://m.blog.naver.com/hbokey "https://m.blog.naver.com/api/blogs/hbokey/post-list?categoryNo=0&itemCount=30&page=1" > m1.json
          python3 -c "import json;d=json.load(open('m1.json'))['result'];it=d['items'];print(len(it),d.get('totalCount'));print(sorted(it[0].keys()));[print(i['logNo'],i.get('sympathyCnt'),i.get('commentCnt'),i.get('readCount'),i.get('addDate')) for i in it[:30]]"
          curl -s -A "$UA" -e https://m.blog.naver.com/hbokey "https://m.blog.naver.com/api/blogs/hbokey/post-list?categoryNo=0&itemCount=30&page=4" | head -c 300; echo
          echo "== m postview"; curl -s -A "$UA" "https://m.blog.naver.com/PostView.naver?blogId=hbokey&logNo=224451116799" | grep -oiE '.{60}(readCount|viewCount|조회).{80}' | head
      - run: |
          git config user.name bot; git config user.email bot@x
          git add probe.txt; git commit -m out; git push
